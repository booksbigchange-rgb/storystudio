name: StoryStudio Lemo-lite export test
on:
  push:
    branches: [feature/story-studio-2-lemo-lite]
    paths:
      - 'integrations/lemo-lite/**'
      - '.github/workflows/lemo-lite-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser automation (CI only)
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Install FFmpeg for Linux CI only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Syntax checks
        run: |
          node --check integrations/lemo-lite/scene/scene.js
          node --check integrations/lemo-lite/vendor/lemo-lib.js
          python -m py_compile integrations/lemo-lite/renderer.py
      - name: Small smoke render
        run: |
          python integrations/lemo-lite/renderer.py --duration 2 --fps 12 --width 640 --height 360 --output exports/lemo-smoke.mp4
      - name: Full 10-second export
        run: |
          python integrations/lemo-lite/renderer.py --duration 10 --fps 24 --width 1280 --height 720 --output exports/lemo-pip-test.mp4
      - name: Preserve video artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: story-studio-lemo-lite-pilot
          path: |
            exports/lemo-smoke.mp4
            exports/lemo-pip-test.mp4
          retention-days: 7
