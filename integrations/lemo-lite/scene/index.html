<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>StoryStudio — Pip and the Star</title>
<style>
  html,body { margin:0; height:100%; background:#18283e; font-family:system-ui,sans-serif; overflow:hidden }
  canvas { width:100vw; height:100vh; display:block }
  #transport { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#fffef6eF;
    box-shadow:0 10px 30px #0003; padding:10px 16px; display:flex; gap:12px; align-items:center; border-radius:16px }
  #transport input { width:min(45vw,340px) } #transport button { cursor:pointer; border:0; color:white;
    background:#194d52; border-radius:10px; padding:8px 14px }
  body.capture #transport { display:none }
</style></head><body>
<canvas id="film" role="img" aria-label="Original short cartoon: Pip the fox meets a friendly star"></canvas>
<div id="transport"><button type="button" id="play">Play</button><input type="range" min="0" max="10" step="0.01" value="0" id="scrub" aria-label="Scene time"/><output id="stamp">0.0s</output></div>
<script type="module" src="./scene.js"></script></body></html>
