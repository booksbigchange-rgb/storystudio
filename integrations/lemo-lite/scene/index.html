<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StoryStudio · Live preview</title>
<style>
html,body{margin:0;height:100%;background:#e7eee9;font-family:system-ui,sans-serif;overflow:hidden}
canvas{display:block} #transport{height:72px;box-sizing:border-box;display:flex;gap:16px;align-items:center;justify-content:center;background:#fff}
#transport input{width:min(48vw,540px);accent-color:#26776a} button{border:0;border-radius:8px;background:#26776a;color:white;padding:12px 24px;cursor:pointer}
output{font-variant-numeric:tabular-nums;color:#354d48;font-size:14px}body.capture #transport{display:none}#error{position:absolute;top:20px;color:#a02535}
</style></head><body>
<canvas id="film" role="img" aria-label="StoryStudio cartoon preview"></canvas><div id="error" role="alert"></div>
<div id="transport"><button type="button" id="play">Play</button><input id="scrub" type="range" min="0" max="10" value="0" step="0.01" aria-label="Scene time"><output id="stamp">0.0s</output></div>
<script type="module" src="scene.js"></script></body></html>
